[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funmite-pos"
version = "1.3.1"
description = "Funmite Clothing & Beyond desktop POS (offline-first)"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.7",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
    "python-barcode>=0.15",
    "httpx>=0.27",
    "pydantic>=2.0",
    "FastAPI>=0.110",
    "uvicorn>=0.29",
    "psycopg2-binary>=2.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
