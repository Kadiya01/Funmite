# Render blueprint for the Funmite cloud sync service (Phase 2 M3 hosting).
#
# One web service runs the FastAPI app against a managed PostgreSQL hosted by
# Neon (external provider). The Neon connection string is supplied as the
# FUNMITE_CLOUD_DB_URL environment variable from the Render dashboard — the
# blueprint declares it WITHOUT a value so the secret stays in the provider and
# is never committed to git. The app also honours the standard DATABASE_URL.
#
# No credentials appear in this file.

services:
  - type: web
    name: funmite-cloud-sync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.sync.cloud_api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Set the value in the Render dashboard (Environment → Secrets):
      #   FUNMITE_CLOUD_DB_URL = <Neon connection string, e.g. with ?sslmode=require>
      - key: FUNMITE_CLOUD_DB_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "true"